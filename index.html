
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="삼일정공 - 기계부품 제작, 가공 및 수리">
  <title>삼일정공 | 기계부품 제작·가공·수리</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #fff;
      color: #222;
    }

    header {
      position: relative;
      z-index: 10;
      width: 100%;
      background: #263b32;
    }

    .header-inner {
      max-width: 1200px;
      min-height: 76px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      color: #70c58a;
      text-decoration: none;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 26px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    nav a:hover {
      color: #8de3a4;
    }

    nav .phone {
      padding: 10px 14px;
      border: 1px solid #70c58a;
      border-radius: 5px;
    }

    main {
      width: 100%;
    }

    .hero {
      position: relative;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      line-height: 0;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      이미지 안의 '주요업무 보기 →' 버튼 위치에 맞춘
      투명 클릭 영역입니다. 실제 위치는 확인 후 조정합니다.
    */
    .hero-button {
      position: absolute;
      left: 7%;
      top: 76%;
      width: 27%;
      height: 10%;
      display: block;
      cursor: pointer;
      border-radius: 4px;
    }

    .hero-button:focus-visible {
      outline: 3px solid #70c58a;
      outline-offset: 3px;
    }

    footer {
      padding: 26px 20px;
      background: #263b32;
      color: #ddd;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    footer a {
      color: #8de3a4;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 14px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo {
        font-size: 23px;
      }

      nav {
        width: 100%;
        justify-content: flex-start;
        gap: 12px 18px;
      }

      nav a {
        font-size: 13px;
      }

      nav .phone {
        padding: 7px 9px;
      }

      .hero-button {
        left: 7%;
        top: 76%;
        width: 34%;
        height: 10%;
      }
    }
  </style>

  <script>
    // 홈페이지를 열거나 새로고침하면 맨 위에서 시작
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    window.addEventListener("pageshow", function () {
      window.scrollTo(0, 0);
    });
  </script>
</head>

<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">삼일정공</a>

      <nav aria-label="주 메뉴">
        <a href="about.html">회사소개</a>
        <a href="services.html">주요업무</a>
        <a href="https://naver.me/GzdcifqP"
           target="_blank" rel="noopener noreferrer">오시는 길</a>
        <a class="phone" href="tel:050713791796">☎ 0507-1379-1796</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="삼일정공 메인 이미지">
      <img src="main-bg.png" alt="삼일정공 기계부품 제작 가공 수리">

      <!-- 이미지 속 주요업무 버튼 부분만 클릭 가능 -->
      <a class="hero-button"
         href="services.html"
         aria-label="주요업무 보기"></a>
    </section>
  </main>

  <footer>
    <strong>삼일정공</strong><br>
    충청북도 음성군 대소읍 오태로 42-14<br>
    전화: <a href="tel:050713791796">0507-1379-1796</a><br>
    © 삼일정공. All rights reserved.
  </footer>
</body>
</html>
